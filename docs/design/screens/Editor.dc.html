<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E4296}
</style>
</helmet>
<div style="min-height: 980px; background: #F6F6F3; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1D1F; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DCDCD6; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
      <a href="#" aria-label="Zurück" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #3A3D41">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 18px; font-weight: 600">Angebot anlegen und versenden</span>
        <span style="font-size: 12px; color: #6B6E72">14 Schritte · gespeichert vor 1 Min.</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="height: 40px; padding: 0 16px; border: 1px solid #CFD0CB; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1B1D1F; cursor: pointer">Vorschau</button>
      <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: #2B59C3; font-family: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">Exportieren</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; max-width: 1440px; width: 100%; box-sizing: border-box; margin: 0 auto">
    <nav aria-label="Schritte" style="flex: 1 1 280px; max-width: 340px; display: flex; flex-direction: column; gap: 4px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6B6E72; margin-bottom: 12px">
        Einleitung
        <textarea rows="3" style="border: 1px solid #CFD0CB; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; resize: vertical; background: #FFFFFF; color: #1B1D1F">So legen Sie ein Angebot an und senden es per E-Mail an den Kunden.</textarea>
      </label>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="8">
        <button onClick="{{s.pick}}" style="{{s.style}}">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6E72; width: 22px; flex: none">{{s.num}}</span>
          <span style="font-size: 14px; line-height: 1.35">{{s.text}}</span>
        </button>
      </sc-for>
      <button style="margin-top: 8px; height: 40px; border: 1px dashed #B9BBB5; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; color: #3A3D41; cursor: pointer">+ Hinweis oder Abschnitt einfügen</button>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 1px solid #DCDCD6; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 12px; align-items: flex-start">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #1B1D1F; color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center">{{current.num}}</span>
          <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6B6E72">
            Schritttext
            <input type="text" value="{{current.text}}" style="height: 40px; border: 1px solid #CFD0CB; border-radius: 8px; padding: 0 12px; font-family: inherit; font-size: 16px; font-weight: 500; color: #1B1D1F">
          </label>
        </div>

        <div role="toolbar" aria-label="Screenshot bearbeiten" style="display: flex; flex-wrap: wrap; gap: 6px">
          <button style="height: 36px; padding: 0 12px; border: 1px solid #2B59C3; border-radius: 8px; background: #EEF2FB; font-family: inherit; font-size: 13px; color: #1E4296; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 7l-4 4M13 7l-8 10M19 7l-8 10M21 11l-4 6"></path></svg>Schwärzen
          </button>
          <button style="height: 36px; padding: 0 12px; border: 1px solid #CFD0CB; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1B1D1F; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg>Zuschneiden
          </button>
          <button style="height: 36px; padding: 0 12px; border: 1px solid #CFD0CB; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1B1D1F; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle></svg>Klickpunkt verschieben
          </button>
          <button style="height: 36px; padding: 0 12px; border: 1px solid #CFD0CB; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1B1D1F; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Pfeil / Text
          </button>
          <button style="height: 36px; padding: 0 12px; border: 1px solid #E8C4C0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #A12A21; display: flex; align-items: center; gap: 6px; cursor: pointer; margin-left: auto">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>Schritt löschen
          </button>
        </div>

        <div role="img" aria-label="Screenshot des Formulars mit markiertem Klickpunkt und geschwärztem Kundenfeld" style="border: 1px solid #DCDCD6; border-radius: 8px; overflow: hidden; background: #FAFAF8">
          <div style="height: 36px; background: #2E3034; display: flex; align-items: center; gap: 14px; padding: 0 14px">
            <div style="width: 18px; height: 18px; border-radius: 4px; background: #5A5D62"></div>
            <div style="width: 54px; height: 8px; border-radius: 4px; background: #6E7176"></div>
            <div style="width: 54px; height: 8px; border-radius: 4px; background: #55585D"></div>
            <div style="width: 54px; height: 8px; border-radius: 4px; background: #55585D"></div>
          </div>
          <div style="padding: 14px 18px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #E7E7E2">
            <div style="position: relative; width: 92px; height: 30px; border-radius: 5px; background: #4A6FD0"></div>
            <div style="width: 80px; height: 30px; border-radius: 5px; background: #E3E4E0"></div>
            <div style="width: 70px; height: 30px; border-radius: 5px; background: #E3E4E0"></div>
            <div style="margin-left: auto; display: flex; gap: 4px">
              <div style="width: 64px; height: 22px; border-radius: 11px; background: #DCE5F7"></div>
              <div style="width: 64px; height: 22px; border-radius: 11px; background: #E9E9E5"></div>
            </div>
          </div>
          <div style="padding: 22px 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 40px; position: relative">
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 60px; height: 8px; border-radius: 4px; background: #B8BAB4"></div><div style="height: 26px; border-bottom: 1px solid #CFD0CB; background: repeating-linear-gradient(135deg, #2E3034 0 6px, #43464B 6px 12px); border-radius: 3px"></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 70px; height: 8px; border-radius: 4px; background: #B8BAB4"></div><div style="height: 26px; border-bottom: 1px solid #CFD0CB"></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 80px; height: 8px; border-radius: 4px; background: #B8BAB4"></div><div style="height: 26px; border-bottom: 1px solid #CFD0CB"></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 50px; height: 8px; border-radius: 4px; background: #B8BAB4"></div><div style="height: 26px; border-bottom: 1px solid #CFD0CB"></div></div>
          </div>
          <div style="padding: 0 26px 26px; display: flex; flex-direction: column; gap: 0">
            <div style="height: 30px; border-bottom: 1px solid #DCDCD6; display: flex; gap: 40px; align-items: center"><div style="width: 80px; height: 8px; border-radius: 4px; background: #A6A8A3"></div><div style="width: 60px; height: 8px; border-radius: 4px; background: #A6A8A3"></div><div style="width: 50px; height: 8px; border-radius: 4px; background: #A6A8A3; margin-left: auto"></div></div>
            <div style="height: 34px; border-bottom: 1px solid #EBEBE7; display: flex; gap: 40px; align-items: center"><div style="width: 140px; height: 8px; border-radius: 4px; background: #CFD0CB"></div><div style="width: 30px; height: 8px; border-radius: 4px; background: #CFD0CB"></div><div style="width: 60px; height: 8px; border-radius: 4px; background: #CFD0CB; margin-left: auto"></div></div>
            <div style="height: 34px; display: flex; align-items: center; position: relative">
              <div style="width: 110px; height: 8px; border-radius: 4px; background: #4A6FD0"></div>
              <div style="position: absolute; left: 22px; top: -9px; width: 52px; height: 52px; border-radius: 50%; border: 3px solid #C8372D; box-sizing: border-box; background: rgba(200,55,45,0.10)"></div>
            </div>
          </div>
        </div>
      </div>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6B6E72">
        Hinweis zu diesem Schritt (optional)
        <textarea rows="2" style="border: 1px solid #CFD0CB; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical; background: #FFFFFF; color: #1B1D1F">Produkte mit Variante erscheinen erst nach Auswahl der Ausprägung.</textarea>
      </label>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 3 };
  }
  renderVals() {
    const texts = [
      'Öffne die App „Verkauf“',
      'Klicke auf „Neu“',
      'Wähle bei „Kunde“ einen Eintrag aus',
      'Klicke auf „Zeile hinzufügen“',
      'Wähle „Produkt“ aus der Liste',
      'Gib bei „Menge“ einen Wert ein',
      'Klicke auf „Bestätigen“',
      'Klicke auf „Per E-Mail senden“'
    ];
    const base = 'display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border-radius: 8px; font-family: inherit; color: #1B1D1F; cursor: pointer; min-height: 44px; box-sizing: border-box; ';
    const steps = texts.map((t, i) => ({
      num: String(i + 1).padStart(2, '0'),
      text: t,
      style: base + (i === this.state.picked ? 'background: #FFFFFF; border: 1px solid #2B59C3;' : 'background: transparent; border: 1px solid transparent;'),
      pick: () => this.setState({ picked: i })
    }));
    return { steps, current: { num: String(this.state.picked + 1), text: texts[this.state.picked] } };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Popup bereit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B59C3}a:hover{color:#1E4296}
</style>
</helmet>
<div style="width: 360px; height: 560px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1D1F; display: flex; flex-direction: column; border: 1px solid #DCDCD6; border-radius: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #ECECE7">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#1B1D1F"></rect><circle cx="12" cy="12" r="4" fill="{{accent}}"></circle></svg>
      <span style="font-weight: 600; font-size: 15px">Workflow Recorder</span>
    </div>
    <button aria-label="Einstellungen" style="width: 36px; height: 36px; border: 0; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #5C5F63; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <div style="padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 14px">
    <button style="height: 52px; border: 0; border-radius: 10px; background: #C8372D; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF; display: block"></span>
      Aufnahme starten
    </button>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #3A3D41">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 28px">
        <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #2B59C3">
        Eingaben automatisch schwärzen
      </label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 28px">
        <input type="checkbox" style="width: 16px; height: 16px; accent-color: #2B59C3">
        Auch Tastatureingaben als Schritt
      </label>
    </div>
  </div>

  <div style="padding: 4px 18px 8px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6E72">Zuletzt</span>
    <a href="#" style="font-size: 13px">Alle anzeigen</a>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; padding: 0 10px">
    <a href="#" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 8px; text-decoration: none; color: #1B1D1F">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Angebot anlegen und versenden</span><span style="font-size: 12px; color: #6B6E72">14 Schritte · heute</span></span>
      <span style="font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #3A3D41; background: #EEF2FB; padding: 3px 7px; border-radius: 5px">HTML</span>
    </a>
    <a href="#" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 8px; text-decoration: none; color: #1B1D1F">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Wareneingang buchen</span><span style="font-size: 12px; color: #6B6E72">9 Schritte · gestern</span></span>
      <span style="font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #3A3D41; background: #EEF2FB; padding: 3px 7px; border-radius: 5px">PDF</span>
    </a>
    <a href="#" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 8px; text-decoration: none; color: #1B1D1F">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">Lieferantenrechnung erfassen</span><span style="font-size: 12px; color: #6B6E72">11 Schritte · Entwurf</span></span>
      <span style="font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #6B6E72; background: #F1F1EE; padding: 3px 7px; border-radius: 5px">—</span>
    </a>
  </div>

  <div style="padding: 12px 18px; border-top: 1px solid #ECECE7; font-size: 12px; color: #6B6E72; display: flex; justify-content: space-between">
    <span>Kurzbefehl</span>
    <span style="font-family: 'IBM Plex Mono', monospace; color: #3A3D41">⌥ ⇧ R</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#0F7B6C","#C8372D","#7A4FD1"]},"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2B59C3' };
  }
}
</script>
</body>
</html>

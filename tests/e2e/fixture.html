<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Angebot S00042 – Beispielkunde GmbH</title>
<style>
body { font-family: sans-serif; margin: 0; }
.o_main_navbar { background: #714B67; height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
.o_main_navbar a { color: #fff; }
.o_control_panel { padding: 12px; display: flex; gap: 8px; align-items: center; }
.o_form_sheet { padding: 24px; display: grid; grid-template-columns: 160px 300px; gap: 16px 12px; }
input { width: 280px; height: 28px; }
table { border-collapse: collapse; margin: 24px; }
td, th { border: 1px solid #ccc; padding: 6px 10px; }
</style></head>
<body>
<nav class="o_main_navbar">
  <div class="o_menu_sections"><a href="#" class="dropdown-toggle" id="menu-orders">Aufträge</a></div>
  <div class="o_menu_systray" style="margin-left:auto;display:flex;gap:12px">
    <div class="o_switch_company_menu"><button type="button" id="company" style="height:30px">Beispiel GmbH</button></div>
    <div class="o_user_menu"><button type="button" id="usermenu" style="height:30px">Max Muster · testdatenbank</button></div>
  </div>
</nav>
<div class="o_control_panel">
  <ol class="breadcrumb"><li class="breadcrumb-item"><a href="#" id="bc">Angebote</a></li><li class="o_last_breadcrumb_item">S00042</li></ol>
  <button class="btn btn-primary" id="confirm" type="button">Bestätigen</button>
  <button class="btn" id="iconbtn" type="button" aria-label="Aktion"><span>⚙</span></button>
  <div class="nav nav-tabs"><a href="#" role="tab" id="tab">Auftragszeilen</a></div>
  <div class="o_statusbar_status" style="margin-left:auto;display:flex;gap:4px">
    <button type="button" class="o_arrow_button o_arrow_button_current" aria-checked="true" id="st-quote">Angebot</button>
    <button type="button" class="o_arrow_button" aria-checked="false" id="st-order">Verkaufsauftrag</button>
  </div>
</div>
<div class="o_form_sheet">
  <div class="o_cell"><label class="o_form_label" for="partner_id_0">Kunde<sup>?</sup></label></div>
  <div class="o_cell"><div name="partner_id" class="o_field_widget o_field_many2one"><input id="partner_id_0" value="Beispielkunde GmbH" role="combobox"></div></div>
  <div class="o_cell"><label class="o_form_label" for="qty_0">Menge</label></div>
  <div class="o_cell"><div name="product_uom_qty" class="o_field_widget"><input id="qty_0" value="5"></div></div>
  <div class="o_cell"><label class="o_form_label" for="email_0">E-Mail</label></div>
  <div class="o_cell"><div name="email" class="o_field_widget"><input id="email_0" type="email" value="kunde@example.invalid"></div></div>
  <div class="o_cell"><label class="o_form_label" for="ref_0">Referenz</label></div>
  <div class="o_cell"><div name="client_order_ref" class="o_field_widget"><input id="ref_0" value="GEHEIM-123"></div></div>
</div>
<table class="o_list_table">
  <thead><tr><th data-name="partner_id">Kunde</th><th data-name="amount">Betrag</th></tr></thead>
  <tbody><tr class="o_data_row"><td name="partner_id" id="rowcell">Beispielkunde GmbH</td><td name="amount">100,00</td></tr></tbody>
</table>
<button type="button" id="open-wizard">Assistent öffnen</button>
<div class="modal-backdrop" id="wiz-bg" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.35)"></div>
<div class="o_dialog" id="wizard" hidden>
  <div class="modal-content" role="dialog" style="position:fixed;left:300px;top:110px;width:520px;height:280px;background:#fff;border:1px solid #999;padding:16px;box-sizing:border-box">
    <h4 class="modal-title" style="margin:0 0 16px">Assistent</h4>
    <label class="o_form_label" for="wiz_partner_0">Rechnungsadresse</label>
    <div name="partner_invoice_id" class="o_field_widget" style="margin-top:110px"><input id="wiz_partner_0" value="Beispielkunde GmbH"></div>
    <button type="button" id="wiz_confirm" style="margin-top:12px">Übernehmen</button>
  </div>
</div>
<script>
// „Bestätigen“ setzt den Status weiter, wie in Odoo (mit kurzer Verzögerung wie nach einem Serveraufruf).
document.getElementById('confirm').addEventListener('click', () => setTimeout(() => {
  for (const b of document.querySelectorAll('.o_statusbar_status button')) {
    const cur = b.id === 'st-order';
    b.classList.toggle('o_arrow_button_current', cur);
    b.setAttribute('aria-checked', cur ? 'true' : 'false');
  }
}, 200));
document.getElementById('open-wizard').addEventListener('click', () => {
  document.getElementById('wizard').hidden = false;
  document.getElementById('wiz-bg').hidden = false;
});
</script>
</body>
</html>

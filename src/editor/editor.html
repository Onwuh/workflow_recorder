<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Recorder</title>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<!-- Übersicht -->
<div id="overview" class="page" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#1B1D1F"></rect><circle cx="12" cy="12" r="4" fill="#2B59C3"></circle></svg>
      <div class="titles">
        <h1 class="h-title">Anleitungen</h1>
        <span id="ov-meta" class="h-meta"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="ov-settings" class="btn" type="button">Einstellungen</button>
      <label class="btn btn-primary file-btn">
        Projekt öffnen
        <input id="ov-import" type="file" accept=".zip,application/zip">
      </label>
    </div>
  </header>
  <main class="ov-main">
    <div id="ov-list" class="ov-list"></div>
  </main>
</div>

<!-- Editor -->
<div id="editor" class="page" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <a id="ed-back" class="back" href="editor.html" aria-label="Zurück zur Übersicht" title="Zurück zur Übersicht">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div class="titles">
        <input id="ed-title" class="title-input" type="text" maxlength="200" aria-label="Titel der Anleitung">
        <span id="ed-meta" class="h-meta"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="ed-backup" class="btn" type="button" title="Projekt als ZIP sichern">Projekt sichern</button>
      <button id="ed-preview" class="btn" type="button">Vorschau</button>
      <button id="ed-export" class="btn btn-primary" type="button">Exportieren</button>
    </div>
  </header>

  <div class="ed-body">
    <nav class="ed-nav" aria-label="Schritte">
      <label class="field intro">
        Einleitung
        <textarea id="ed-intro" class="textarea" rows="3" maxlength="5000" placeholder="Worum geht es in dieser Anleitung?"></textarea>
      </label>
      <div id="ed-steps" class="step-list" role="listbox" aria-label="Schritte"></div>
      <button id="ed-add-section" class="add-section" type="button">+ Hinweis oder Abschnitt einfügen</button>
    </nav>

    <main class="ed-main">
      <div id="ed-empty" class="card empty-card" hidden>Diese Anleitung hat noch keine Schritte.</div>
      <div id="ed-card" class="card">
        <div class="step-head">
          <span id="ed-num" class="num-circle">1</span>
          <label class="field grow">
            <span id="ed-text-label">Schritttext</span>
            <input id="ed-text" class="input step-text" type="text" maxlength="200">
          </label>
        </div>

        <div id="ed-warn" class="warn" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
          <span><span id="ed-warn-text"></span> <button id="ed-reviewed" class="btn-link inline" type="button">Als geprüft markieren</button></span>
        </div>

        <div id="ed-toolbar" role="toolbar" aria-label="Screenshot bearbeiten" class="toolbar">
          <button class="tool" data-tool="redact" type="button" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 7l-4 4M13 7l-8 10M19 7l-8 10M21 11l-4 6"></path></svg>Schwärzen
          </button>
          <button class="tool" data-tool="crop" type="button" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"></path></svg>Zuschneiden
          </button>
          <button class="tool" data-tool="marker" type="button" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2"></circle></svg>Klickpunkt verschieben
          </button>
          <button class="tool" data-tool="arrow" type="button" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Pfeil / Text
          </button>
          <button id="ed-undo" class="tool" type="button" disabled title="Letzte Bildänderung rückgängig machen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>Rückgängig
          </button>
          <button id="ed-delete" class="tool danger" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>Schritt löschen
          </button>
        </div>

        <p id="ed-hint" class="tool-hint" role="status"></p>

        <div id="ed-stage" class="stage">
          <img id="ed-img" alt="Screenshot des Schritts">
          <svg id="ed-svg" class="stage-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </div>

        <div id="ed-crop-bar" class="sub-bar" hidden>
          <span>Bereich gewählt.</span>
          <button id="ed-crop-apply" class="btn btn-primary" type="button">Zuschneiden übernehmen</button>
          <button id="ed-crop-cancel" class="btn" type="button">Abbrechen</button>
        </div>

        <div id="ed-arrow-bar" class="sub-bar" hidden>
          <label class="field grow">Text am Pfeil (optional)
            <input id="ed-arrow-text" class="input" type="text" maxlength="80">
          </label>
          <button id="ed-arrows-clear" class="btn" type="button">Alle Pfeile entfernen</button>
        </div>

        <div class="step-opts">
          <label class="check"><input id="ed-show-marker" type="checkbox"> Klickpunkt anzeigen</label>
          <span class="spacer"></span>
          <button id="ed-up" class="btn" type="button" title="Schritt nach oben">↑ Nach oben</button>
          <button id="ed-down" class="btn" type="button" title="Schritt nach unten">↓ Nach unten</button>
        </div>
      </div>

      <label id="ed-note-wrap" class="field">
        <span id="ed-note-label">Hinweis zu diesem Schritt (optional)</span>
        <textarea id="ed-note" class="textarea note" rows="2" maxlength="5000"></textarea>
      </label>
    </main>
  </div>
</div>

<!-- Export-Dialog -->
<dialog id="export" class="export" aria-labelledby="ex-title">
  <form method="dialog" class="ex-form" id="ex-form">
    <div class="ex-head">
      <div class="ex-titles">
        <h2 id="ex-title">Anleitung exportieren</h2>
        <span id="ex-sub" class="h-meta"></span>
      </div>
      <button id="ex-close" class="btn-icon" type="button" aria-label="Schließen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div id="ex-formats" class="ex-formats" role="radiogroup" aria-label="Format"></div>

    <div class="ex-opts">
      <span class="eyebrow">Optionen</span>
      <div id="ex-odoo" hidden>
        <ol class="ex-steps">
          <li>Auf „In Zwischenablage kopieren“ klicken</li>
          <li>In Odoo Wissen einen neuen Artikel anlegen</li>
          <li>In den Artikel klicken und einfügen (<span id="ex-paste-key">⌘ V</span>)</li>
        </ol>
        <div class="ex-size">
          <span id="ex-size-label">Bilder max. 1000 px breit, WebP</span>
          <span id="ex-size" class="mono">…</span>
        </div>
      </div>
      <label class="check"><input id="ex-cover" type="checkbox" checked> Titelseite mit Kundenlogo</label>
      <div id="ex-logo" class="ex-logo" hidden>
        <img id="ex-logo-img" alt="Kundenlogo" hidden>
        <label class="btn file-btn small">
          <span id="ex-logo-label">Logo wählen</span>
          <input id="ex-logo-file" type="file" accept="image/png,image/jpeg,image/webp">
        </label>
        <button id="ex-logo-remove" class="btn-link" type="button" hidden>Entfernen</button>
      </div>
      <label class="check"><input id="ex-marker" type="checkbox" checked> Klickpunkt im Screenshot markieren</label>
      <label class="check"><input id="ex-crop" type="checkbox"> Screenshots auf Klickbereich zuschneiden</label>
      <div id="ex-warn" class="warn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
        <span><span id="ex-warn-text"></span> <button id="ex-warn-check" class="btn-link inline" type="button">Prüfen</button></span>
      </div>
      <p id="ex-status" class="ex-status" role="status"></p>
    </div>

    <div class="ex-actions">
      <button id="ex-cancel" class="btn" type="button">Abbrechen</button>
      <button id="ex-go" class="btn btn-primary" type="button">HTML herunterladen</button>
    </div>
  </form>
</dialog>

<script src="../db.js"></script>
<script src="../settings.js"></script>
<script src="../lib/util.js"></script>
<script src="../lib/render.js"></script>
<script src="../lib/zip.js"></script>
<script src="../lib/project.js"></script>
<script src="../lib/pdf.js"></script>
<script src="../export/exporters.js"></script>
<script src="editor.js"></script>
<script src="export-dialog.js"></script>
</body>
</html>
